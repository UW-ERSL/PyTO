MATERIAL:
  youngs_modulus: 2.0e+11
  poissons_ratio: 0.28
  conductivity: 50.0
  density: 7700.0
  specific_heat: 460.0
  alpha: 1.3e-5

PLOT:
  figure.dpi: 200  # High resolution for print
  savefig.dpi: 200  # Resolution when saving figures
  font.family: serif  # Serif fonts are often preferred in publications
  font.size: 12
  axes.labelsize: 12
  axes.titlesize: 14
  xtick.labelsize: 10
  ytick.labelsize: 10
  legend.fontsize: 10
  figure.figsize: [6, 4]  # Adjust for your specific needs
  text.usetex: False  # Set to True if you want LaTeX rendering
  lines.linewidth: 1.5
  lines.markersize: 6  # Marker size
  axes.linewidth: 1.0
  axes.spines.right: False  # Remove right spine
  axes.spines.top: False  # Remove top spine
  grid.linestyle: ":"
  grid.linewidth: 0.5
  savefig.bbox: tight  # Ensures no excessive white space
  savefig.format: pdf  # PDF is a good format for publications